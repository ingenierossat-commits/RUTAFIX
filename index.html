<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUTAFIX — Técnicos SAT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F58C2A">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg: #0D111C;
  --bg2: #141927;
  --bg3: #1C2333;
  --border: #2A3347;
  --accent: #F58C2A;
  --accent2: #E06B10;
  --danger: #E53E3E;
  --ok: #38A169;
  --text: #E8EAF0;
  --muted: #6B7A99;
  --card: #1A2035;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --r: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── HEADER ─── */
.header {
  background: var(--bg2);
  border-bottom: 2px solid var(--accent);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 1.6rem;
  letter-spacing: 3px;
  color: var(--accent);
  display: flex;
  align-items: center;
}
.header-user {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: right;
  line-height: 1.3;
}
.header-user strong { color: var(--text); font-size: 0.9rem; display: block; }

/* ─── NAV TABS ─── */
.nav {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 57px;
  z-index: 99;
}
.nav-btn {
  flex: 1;
  padding: 12px 4px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
}
.nav-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ─── SCREENS ─── */
.screen { display: none; padding: 16px; padding-bottom: 80px; }
.screen.active { display: block; }

/* ─── CARDS ─── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 10px;
}

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #0D111C; }
.btn-primary:active { background: var(--accent2); }
.btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:active { background: var(--border); }
.btn-danger { background: rgba(229,62,62,0.15); color: var(--danger); border: 1px solid rgba(229,62,62,0.3); }
.btn-ok { background: rgba(56,161,105,0.15); color: var(--ok); border: 1px solid rgba(56,161,105,0.3); }
.btn-sm { padding: 6px 10px; font-size: 0.8rem; }
.btn-full { width: 100%; justify-content: center; margin-bottom: 8px; }

/* ─── INPUTS ─── */
.input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.input:focus { border-color: var(--accent); }
.input::placeholder { color: var(--muted); }

select.input { cursor: pointer; }

.field-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
  display: block;
}
.field { margin-bottom: 12px; }

/* ─── SECTION TITLE ─── */
.section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title span { color: var(--accent); }

/* ─── UBICACIÓN CARD ─── */
.loc-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  overflow: hidden;
}
.loc-card-header {
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.loc-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 4px;
  background: var(--bg3);
  color: var(--muted);
  white-space: nowrap;
}
.loc-badge.hotel { background: rgba(245,140,42,0.15); color: var(--accent); }
.loc-badge.hospital { background: rgba(56,161,105,0.15); color: var(--ok); }

.loc-name {
  flex: 1;
  font-weight: 500;
  font-size: 0.95rem;
  line-height: 1.3;
}
.loc-chain { font-size: 0.75rem; color: var(--muted); }

.pending-count {
  background: var(--danger);
  color: white;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  padding: 2px 7px;
  border-radius: 99px;
  min-width: 22px;
  text-align: center;
}
.pending-count.zero { background: var(--bg3); color: var(--muted); }

.loc-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
.loc-body.open { display: block; }

.pending-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.pending-item:last-of-type { border-bottom: none; }
.pending-text {
  flex: 1;
  font-size: 0.9rem;
  line-height: 1.4;
  padding-top: 1px;
}
.pending-text.done {
  text-decoration: line-through;
  color: var(--muted);
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  flex-shrink: 0;
  cursor: pointer;
  margin-top: 2px;
}

.add-pending-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.add-pending-row .input { flex: 1; }

.loc-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

/* ─── RUTA DEL DÍA ─── */
.ruta-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}
.ruta-sep {
  color: var(--muted);
  font-size: 1.2rem;
  font-weight: 300;
}

.ruta-stop {
  position: relative;
}
.ruta-stop-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 14px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  min-width: 90px;
  font-family: 'Barlow Condensed', sans-serif;
}
.ruta-stop-btn.has-pending {
  border-color: var(--danger);
  animation: pulse-red 2s infinite;
}
.ruta-stop-btn.active {
  border-color: var(--accent);
  background: rgba(245,140,42,0.08);
}
.ruta-stop-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  text-align: center;
  line-height: 1.2;
  max-width: 100px;
}
.ruta-stop-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
.ruta-stop-remove {
  position: absolute;
  top: -7px;
  right: -7px;
  width: 20px;
  height: 20px;
  background: var(--danger);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 0.7rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(229,62,62,0); }
}

.ruta-expanded {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 16px;
  animation: slideDown 0.2s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.ruta-expanded-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

/* ─── SELECTOR DE UBICACIÓN ─── */
.loc-selector {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 4px;
  max-height: 240px;
  overflow-y: auto;
}
.loc-selector-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.1s;
}
.loc-selector-item:last-child { border-bottom: none; }
.loc-selector-item:active { background: var(--border); }
.loc-selector-item .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

/* ─── VOZ ─── */
.mic-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.1rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.mic-btn.listening {
  background: rgba(229,62,62,0.15);
  border-color: var(--danger);
  color: var(--danger);
  animation: mic-pulse 1s infinite;
}
@keyframes mic-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* ─── LOGIN ─── */
#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
}
.login-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 4rem;
  letter-spacing: 6px;
  color: var(--accent);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
}
.login-sub {
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 40px;
}
.tech-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin-bottom: 24px;
}
.tech-btn {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--r);
  padding: 20px 12px;
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 1px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.tech-btn:active { border-color: var(--accent); background: rgba(245,140,42,0.08); }
.tech-initial {
  width: 40px;
  height: 40px;
  background: var(--accent);
  color: #0D111C;
  border-radius: 50%;
  font-size: 1.3rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 8px;
}

/* ─── MODAL ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 1.3rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-close {
  background: var(--bg3);
  border: none;
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── SEARCH BAR ─── */
.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.search-row .input { flex: 1; }

/* ─── EMPTY STATE ─── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; }
.empty p { font-size: 0.9rem; line-height: 1.5; }

/* ─── BOTTOM ACTIONS ─── */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  z-index: 98;
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ok);
  color: white;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 300;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
  <div class="login-logo">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#F58C2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:12px;margin-top:-6px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>RUTAFIX
  </div>
  <div class="login-sub">Técnicos SAT · Puertas Automáticas</div>
  <div class="tech-grid" id="tech-grid"></div>
  <button class="btn btn-ghost btn-sm" onclick="showAddTechModal()">+ Añadir técnico</button>
</div>

<!-- ─── APP ─── -->
<div id="app" style="display:none">
  <div class="header">
    <div class="header-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F58C2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:8px;margin-top:-3px"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>RUTAFIX
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showScreen('ruta')">📍 RUTA</button>
    <button class="nav-btn" onclick="showScreen('ubicaciones')">🏨 LUGARES</button>
  </nav>

  <!-- RUTA DEL DÍA -->
  <div id="screen-ruta" class="screen active">
    <div class="section-title">Ruta de hoy <span id="ruta-date"></span></div>

    <div id="ruta-chain" class="ruta-chain"></div>
    <div id="ruta-expanded-area"></div>

    <div id="ruta-empty" class="empty" style="display:none">
      <div class="empty-icon">🗺️</div>
      <p>Sin paradas.<br>Añade lugares para empezar la ruta.</p>
    </div>

    <div id="ruta-add-area">
      <div class="section-title" style="margin-top:8px">Añadir parada</div>
      <div class="search-row">
        <input class="input" id="ruta-search" placeholder="Buscar lugar..." oninput="filterRutaSearch()" autocomplete="off">
        <button class="mic-btn" id="ruta-mic" onclick="voiceSearch('ruta-search', 'filterRutaSearch')">🎤</button>
      </div>
      <div id="ruta-search-list" class="loc-selector" style="display:none"></div>
    </div>

    <div style="height:16px"></div>
    <button class="btn btn-danger btn-sm" onclick="clearRuta()" id="btn-clear-ruta" style="display:none">🗑 Borrar toda la ruta</button>
  </div>

  <!-- UBICACIONES -->
  <div id="screen-ubicaciones" class="screen">
    <div class="section-title">Lugares</div>
    <div class="search-row">
      <input class="input" id="loc-search" placeholder="Buscar lugar..." oninput="filterLocs()" autocomplete="off">
      <button class="mic-btn" id="loc-mic" onclick="voiceSearch('loc-search', 'filterLocs')">🎤</button>
    </div>
    <div id="loc-list"></div>
    <div id="loc-empty" class="empty" style="display:none">
      <div class="empty-icon">📭</div>
      <p>No se encontraron lugares.</p>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button class="btn btn-primary" style="flex:1" onclick="showAddLocModal()">+ Nueva ubicación</button>
  </div>
</div>

<!-- ─── MODAL: AÑADIR TÉCNICO ─── -->
<div class="modal-overlay" id="modal-tech">
  <div class="modal">
    <div class="modal-title">Nuevo técnico <button class="modal-close" onclick="closeModal('modal-tech')">✕</button></div>
    <div class="field">
      <label class="field-label">Nombre</label>
      <input class="input" id="new-tech-name" placeholder="Tu nombre">
    </div>
    <button class="btn btn-primary btn-full" onclick="addTech()">Guardar</button>
  </div>
</div>

<!-- ─── MODAL: AÑADIR / EDITAR UBICACIÓN ─── -->
<div class="modal-overlay" id="modal-loc">
  <div class="modal">
    <div class="modal-title" id="modal-loc-title">Nueva ubicación <button class="modal-close" onclick="closeModal('modal-loc')">✕</button></div>
    <input type="hidden" id="edit-loc-id">

    <div class="field">
      <label class="field-label">Categoría</label>
      <select class="input" id="loc-cat" onchange="onCatChange()">
        <option value="">— Sin categoría —</option>
        <option value="hotel">Hotel</option>
        <option value="hospital">Hospital</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <div class="field" id="field-chain" style="display:none">
      <label class="field-label">Cadena hotelera</label>
      <input class="input" id="loc-chain" placeholder="Meliá, NH, Hilton...">
    </div>

    <div class="field">
      <label class="field-label">Nombre del lugar</label>
      <input class="input" id="loc-name" placeholder="Hotel Palacio, Hospital Can Misses...">
    </div>

    <div class="field">
      <label class="field-label">Referencia / Dirección (opcional)</label>
      <input class="input" id="loc-ref" placeholder="Calle, zona, referencia...">
    </div>

    <button class="btn btn-primary btn-full" onclick="saveLoc()">Guardar ubicación</button>
    <button class="btn btn-danger btn-full" id="btn-delete-loc" onclick="deleteLoc()" style="display:none">Eliminar ubicación</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// FIREBASE CONFIG
// ══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyChMXx5ZcleAo5oqzPvo1K_Af_wgQkh-LQ",
  authDomain: "listify-16b5d.firebaseapp.com",
  databaseURL: "https://listify-16b5d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "listify-16b5d",
  storageBucket: "listify-16b5d.firebasestorage.app",
  messagingSenderId: "238610923350",
  appId: "1:238610923350:web:cd5c2c3fb23b5c0afba0f7"
};

let fbApp, db;
try {
  fbApp = firebase.apps.length ? firebase.app('rutafix') : firebase.initializeApp(firebaseConfig, 'rutafix');
} catch(e) { fbApp = firebase.app('rutafix'); }
db = firebase.database(fbApp);

const REF_LOCS  = () => db.ref('rutafix/ubicaciones');
const REF_PEND  = (locId) => db.ref(`rutafix/pendientes/${locId}`);

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let allLocs = {};
let allPend = {};
let ruta = [];
let expandedStop = null;

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
window.onload = () => {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('ruta-date').textContent = new Date().toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();
  // Recuperar ruta del día desde localStorage
  const savedRuta = localStorage.getItem('rutafix_ruta');
  if (savedRuta) {
    try { ruta = JSON.parse(savedRuta); } catch(e) { ruta = []; }
  }
  startListening();
};

function saveRuta() {
  localStorage.setItem('rutafix_ruta', JSON.stringify(ruta));
}

function startListening() {
  REF_LOCS().on('value', snap => {
    allLocs = {};
    if (snap.exists()) snap.forEach(c => { allLocs[c.key] = c.val(); });
    renderLocs();
    renderRuta();
  });

  db.ref('rutafix/pendientes').on('value', snap => {
    allPend = {};
    if (snap.exists()) {
      snap.forEach(locSnap => {
        allPend[locSnap.key] = {};
        locSnap.forEach(pSnap => { allPend[locSnap.key][pSnap.key] = pSnap.val(); });
      });
    }
    renderLocs();
    renderRuta();
  });
}

// ══════════════════════════════════════════════
// SCREENS / NAV
// ══════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ══════════════════════════════════════════════
// UBICACIONES
// ══════════════════════════════════════════════
function renderLocs(filter = '') {
  const list = document.getElementById('loc-list');
  const empty = document.getElementById('loc-empty');
  const q = filter.toLowerCase();
  const ids = Object.keys(allLocs).filter(id => {
    const l = allLocs[id];
    return !q || (l.name||'').toLowerCase().includes(q) || (l.chain||'').toLowerCase().includes(q) || (l.ref||'').toLowerCase().includes(q);
  });

  if (ids.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Ordenar: con pendientes primero
  ids.sort((a, b) => {
    const pa = pendCount(a);
    const pb = pendCount(b);
    if (pb !== pa) return pb - pa;
    return (allLocs[a].name||'').localeCompare(allLocs[b].name||'');
  });

  list.innerHTML = '';
  ids.forEach(id => {
    const l = allLocs[id];
    const pc = pendCount(id);
    const div = document.createElement('div');
    div.className = 'loc-card';
    div.id = 'loc-card-' + id;

    let badgeClass = '';
    if (l.cat === 'hotel') badgeClass = 'hotel';
    else if (l.cat === 'hospital') badgeClass = 'hospital';

    div.innerHTML = `
      <div class="loc-card-header" onclick="toggleLocCard('${id}')">
        ${l.cat ? `<span class="loc-badge ${badgeClass}">${l.cat}</span>` : ''}
        <div class="loc-name">
          ${l.chain ? `<div class="loc-chain">${l.chain}</div>` : ''}
          ${l.name}
        </div>
        <span class="pending-count ${pc === 0 ? 'zero' : ''}">${pc}</span>
        <span style="color:var(--muted);margin-left:4px">▾</span>
      </div>
      <div class="loc-body" id="loc-body-${id}">
        <div id="pend-list-${id}"></div>
        <div class="add-pending-row">
          <input class="input" id="pend-input-${id}" placeholder="Añadir tarea pendiente..." onkeydown="if(event.key==='Enter')addPend('${id}')">
          <button class="mic-btn" onclick="voiceSearch('pend-input-${id}', null, '${id}')">🎤</button>
          <button class="btn btn-primary btn-sm" onclick="addPend('${id}')">+</button>
        </div>
        <div class="loc-actions">
          <button class="btn btn-ghost btn-sm" onclick="editLoc('${id}')">✏️ Editar</button>
          <button class="btn btn-ok btn-sm" onclick="addToRuta('${id}')">📍 A la ruta</button>
        </div>
      </div>
    `;
    list.appendChild(div);
    renderPendList(id);
  });
}

function pendCount(locId) {
  const p = allPend[locId];
  if (!p) return 0;
  return Object.values(p).filter(x => !x.done).length;
}

function toggleLocCard(id) {
  const body = document.getElementById('loc-body-' + id);
  body.classList.toggle('open');
}

function renderPendList(locId) {
  const container = document.getElementById('pend-list-' + locId);
  if (!container) return;
  const p = allPend[locId] || {};
  const items = Object.entries(p);
  if (items.length === 0) {
    container.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:8px 0">Sin tareas pendientes</div>';
    return;
  }
  container.innerHTML = '';
  items.forEach(([pid, pval]) => {
    const div = document.createElement('div');
    div.className = 'pending-item';
    div.innerHTML = `
      <input type="checkbox" ${pval.done ? 'checked' : ''} onchange="togglePend('${locId}','${pid}',this.checked)">
      <span class="pending-text ${pval.done ? 'done' : ''}">${pval.text}</span>
      <button class="btn btn-danger btn-sm" style="padding:4px 8px" onclick="deletePend('${locId}','${pid}')">✕</button>
    `;
    container.appendChild(div);
  });
}

function filterLocs() {
  const q = document.getElementById('loc-search').value;
  renderLocs(q);
}

function addPend(locId) {
  const inp = document.getElementById('pend-input-' + locId);
  const text = inp.value.trim();
  if (!text) return;
  const newRef = REF_PEND(locId).push();
  newRef.set({ text, done: false, by: currentUser.name, ts: Date.now() });
  inp.value = '';
  showToast('Pendiente añadido');
}

function togglePend(locId, pendId, done) {
  REF_PEND(locId).child(pendId).update({ done, resolvedBy: done ? currentUser.name : null });
}

function deletePend(locId, pendId) {
  REF_PEND(locId).child(pendId).remove();
}

// ── MODAL UBICACIÓN ──
function showAddLocModal() {
  document.getElementById('modal-loc-title').innerHTML = 'Nueva ubicación <button class="modal-close" onclick="closeModal(\'modal-loc\')">✕</button>';
  document.getElementById('edit-loc-id').value = '';
  document.getElementById('loc-cat').value = '';
  document.getElementById('loc-chain').value = '';
  document.getElementById('loc-name').value = '';
  document.getElementById('loc-ref').value = '';
  document.getElementById('field-chain').style.display = 'none';
  document.getElementById('btn-delete-loc').style.display = 'none';
  openModal('modal-loc');
}

function editLoc(id) {
  const l = allLocs[id];
  if (!l) return;
  document.getElementById('modal-loc-title').innerHTML = 'Editar ubicación <button class="modal-close" onclick="closeModal(\'modal-loc\')">✕</button>';
  document.getElementById('edit-loc-id').value = id;
  document.getElementById('loc-cat').value = l.cat || '';
  document.getElementById('loc-chain').value = l.chain || '';
  document.getElementById('loc-name').value = l.name || '';
  document.getElementById('loc-ref').value = l.ref || '';
  document.getElementById('field-chain').style.display = l.cat === 'hotel' ? 'block' : 'none';
  document.getElementById('btn-delete-loc').style.display = 'block';
  openModal('modal-loc');
}

function onCatChange() {
  const cat = document.getElementById('loc-cat').value;
  document.getElementById('field-chain').style.display = cat === 'hotel' ? 'block' : 'none';
}

function saveLoc() {
  const id = document.getElementById('edit-loc-id').value;
  const data = {
    cat: document.getElementById('loc-cat').value,
    chain: document.getElementById('loc-chain').value.trim(),
    name: document.getElementById('loc-name').value.trim(),
    ref: document.getElementById('loc-ref').value.trim(),
  };
  if (!data.name) { alert('El nombre es obligatorio'); return; }
  if (id) {
    REF_LOCS().child(id).update(data);
    showToast('Ubicación actualizada');
  } else {
    REF_LOCS().push(data);
    showToast('Ubicación guardada');
  }
  closeModal('modal-loc');
}

function deleteLoc() {
  const id = document.getElementById('edit-loc-id').value;
  if (!id) return;
  if (!confirm('¿Eliminar esta ubicación y todos sus pendientes?')) return;
  REF_LOCS().child(id).remove();
  db.ref(`rutero/pendientes/${id}`).remove();
  ruta = ruta.filter(r => r !== id);
  renderRuta();
  closeModal('modal-loc');
  showToast('Ubicación eliminada');
}

// ══════════════════════════════════════════════
// RUTA DEL DÍA
// ══════════════════════════════════════════════
function renderRuta() {
  const chain = document.getElementById('ruta-chain');
  const emptyEl = document.getElementById('ruta-empty');
  const clearBtn = document.getElementById('btn-clear-ruta');
  const expandedArea = document.getElementById('ruta-expanded-area');

  chain.innerHTML = '';

  const valid = ruta.filter(id => allLocs[id]);

  if (valid.length === 0) {
    emptyEl.style.display = 'block';
    clearBtn.style.display = 'none';
    expandedArea.innerHTML = '';
    return;
  }

  emptyEl.style.display = 'none';
  clearBtn.style.display = 'inline-flex';

  valid.forEach((id, idx) => {
    if (idx > 0) {
      const sep = document.createElement('span');
      sep.className = 'ruta-sep';
      sep.textContent = '—';
      chain.appendChild(sep);
    }

    const l = allLocs[id];
    const pc = pendCount(id);
    const stop = document.createElement('div');
    stop.className = 'ruta-stop';

    const isExpanded = expandedStop === id;
    stop.innerHTML = `
      <div class="ruta-stop-btn ${pc > 0 ? 'has-pending' : ''} ${isExpanded ? 'active' : ''}" onclick="toggleRutaStop('${id}')">
        <div class="ruta-stop-name">${l.name}</div>
        ${pc > 0 ? `<div class="ruta-stop-sub">⚠️ ${pc} pendiente${pc>1?'s':''}</div>` : '<div class="ruta-stop-sub">✓ OK</div>'}
      </div>
      <button class="ruta-stop-remove" onclick="removeFromRuta('${id}')">✕</button>
    `;
    chain.appendChild(stop);
  });

  // Expanded panel
  if (expandedStop && allLocs[expandedStop]) {
    const l = allLocs[expandedStop];
    const p = allPend[expandedStop] || {};
    const items = Object.entries(p);
    let pendHTML = '';
    if (items.length === 0) {
      pendHTML = '<div style="color:var(--muted);font-size:0.85rem">Sin tareas pendientes en este lugar ✓</div>';
    } else {
      items.forEach(([pid, pval]) => {
        pendHTML += `
          <div class="pending-item">
            <input type="checkbox" ${pval.done ? 'checked' : ''} onchange="togglePend('${expandedStop}','${pid}',this.checked)">
            <span class="pending-text ${pval.done ? 'done' : ''}">${pval.text}</span>
          </div>
        `;
      });
    }

    const addPendId = `ruta-pend-input-${expandedStop}`;
    expandedArea.innerHTML = `
      <div class="ruta-expanded">
        <div class="ruta-expanded-title">📍 ${l.chain ? l.chain + ' · ' : ''}${l.name}</div>
        ${pendHTML}
        <div class="add-pending-row" style="margin-top:12px">
          <input class="input" id="${addPendId}" placeholder="Añadir pendiente..." onkeydown="if(event.key==='Enter')addPendRuta('${expandedStop}')">
          <button class="mic-btn" onclick="voiceSearch('${addPendId}', null, '${expandedStop}')">🎤</button>
          <button class="btn btn-primary btn-sm" onclick="addPendRuta('${expandedStop}')">+</button>
        </div>
      </div>
    `;
  } else {
    expandedArea.innerHTML = '';
  }
}

function addPendRuta(locId) {
  const inp = document.getElementById(`ruta-pend-input-${locId}`);
  const text = (inp?.value || '').trim();
  if (!text) return;
  const newRef = REF_PEND(locId).push();
  newRef.set({ text, done: false, by: currentUser.name, ts: Date.now() });
  inp.value = '';
  showToast('Pendiente añadido');
}

function toggleRutaStop(id) {
  expandedStop = expandedStop === id ? null : id;
  renderRuta();
}

function addToRuta(locId) {
  if (!ruta.includes(locId)) {
    ruta.push(locId);
    saveRuta();
    showToast('Añadido a la ruta');
    renderRuta();
    showScreen_direct('ruta');
  } else {
    showToast('Ya está en la ruta');
  }
}

function removeFromRuta(locId) {
  ruta = ruta.filter(id => id !== locId);
  if (expandedStop === locId) expandedStop = null;
  saveRuta();
  renderRuta();
}

function clearRuta() {
  if (!confirm('¿Borrar toda la ruta de hoy?')) return;
  ruta = [];
  expandedStop = null;
  saveRuta();
  renderRuta();
}

function showScreen_direct(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn')[name === 'ruta' ? 0 : 1].classList.add('active');
}

// ── BUSCADOR DE RUTA ──
function filterRutaSearch() {
  const q = document.getElementById('ruta-search').value.toLowerCase().trim();
  const listEl = document.getElementById('ruta-search-list');
  if (!q) { listEl.style.display = 'none'; return; }
  const matches = Object.entries(allLocs).filter(([id, l]) =>
    (l.name||'').toLowerCase().includes(q) || (l.chain||'').toLowerCase().includes(q)
  );
  if (matches.length === 0) { listEl.style.display = 'none'; return; }
  listEl.style.display = 'block';
  listEl.innerHTML = '';
  matches.forEach(([id, l]) => {
    const div = document.createElement('div');
    div.className = 'loc-selector-item';
    div.innerHTML = `${l.name}${l.chain ? `<div class="sub">${l.chain}</div>` : ''}`;
    div.onclick = () => {
      addToRuta(id);
      document.getElementById('ruta-search').value = '';
      listEl.style.display = 'none';
    };
    listEl.appendChild(div);
  });
}

// ══════════════════════════════════════════════
// TÉCNICOS
// ══════════════════════════════════════════════
function showAddTechModal() { openModal('modal-tech'); }
function addTech() {
  const name = document.getElementById('new-tech-name').value.trim();
  if (!name) return;
  REF_TECHS().push({ name });
  closeModal('modal-tech');
  document.getElementById('new-tech-name').value = '';
}

// ══════════════════════════════════════════════
// VOZ
// ══════════════════════════════════════════════
let recognition = null;
let activeMicInput = null;
let activeMicCallback = null;
let activeMicLocId = null;

function voiceSearch(inputId, callbackName, locId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert('Tu navegador no soporta reconocimiento de voz'); return; }

  // Determinar botón mic correcto
  const micBtns = document.querySelectorAll('.mic-btn');
  let micBtn = null;
  micBtns.forEach(b => {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(inputId)) micBtn = b;
  });

  if (recognition) {
    recognition.stop();
    recognition = null;
    if (micBtn) micBtn.classList.remove('listening');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;

  if (micBtn) micBtn.classList.add('listening');

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    const inp = document.getElementById(inputId);
    if (inp) {
      inp.value = transcript;
      if (callbackName && window[callbackName]) window[callbackName]();
      if (locId) {
        // Si es para pendiente, autosubmit
        addPend(locId) || addPendRuta(locId);
      }
    }
  };
  recognition.onend = () => {
    recognition = null;
    if (micBtn) micBtn.classList.remove('listening');
  };
  recognition.onerror = () => {
    recognition = null;
    if (micBtn) micBtn.classList.remove('listening');
  };
  recognition.start();
}

// ══════════════════════════════════════════════
// MODALES
// ══════════════════════════════════════════════
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
// Cerrar al tocar overlay
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
